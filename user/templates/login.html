{% load tailwind_tags %}
{% tailwind_css %}

<h1>Login</h1>

<form method="post">
    {% csrf_token %}
    <label>username</label>
    <input type="text" name="username">

    <label>password</label>
    <input type="password" name="password">

    <button type="submit">Login</button>
</form>

<p><a href="">Forgot password?</a></p>

<p><a href="{% url 'user:signup' %}">Signup</a></p>
